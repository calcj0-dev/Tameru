<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:"Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;background:linear-gradient(135deg,#0d9488 0%,#0f766e 100%);color:#fff;position:relative;overflow:hidden}
.wrap{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:22px}
.logo{width:92px;height:92px;border-radius:24px;background:#fff;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.name{font-size:64px;font-weight:800;letter-spacing:.14em}
.kana{font-size:24px;opacity:.85;margin-top:2px;letter-spacing:.1em}
.copy{margin-top:46px;font-size:50px;font-weight:700;line-height:1.35}
.points{margin-top:34px;display:flex;flex-direction:column;gap:14px;font-size:28px;font-weight:600}
.points div{display:flex;align-items:center;gap:14px}
.check{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:20px}
.chart{position:absolute;right:64px;bottom:64px;width:430px;height:196px;background:rgba(255,255,255,.96);border-radius:28px;box-shadow:0 20px 50px rgba(0,0,0,.2);padding:26px 28px}
.chart .t{color:#64748b;font-size:20px;font-weight:600}
.chart .v{color:#0f172a;font-size:34px;font-weight:800;margin-top:4px}
.chart .d{position:absolute;right:28px;top:26px;color:#059669;font-size:20px;font-weight:700}
</style></head><body><div class="wrap">
<div class="brand"><div class="logo"><svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17h3v2a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-3a3.16 3.16 0 0 0 2-2h1a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1h-1a5 5 0 0 0-2-4V3a4 4 0 0 0-3.2 1.6l-.3.4H11a6 6 0 0 0-6 6v1a5 5 0 0 0 2 4v3a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1z"/><path d="M16 10h.01"/><path d="M2 8v1a2 2 0 0 0 2 2h1"/></svg></div>
<div><div class="name">TAMERU</div><div class="kana">タメル</div></div></div>
<div class="copy">資産を、<br>スプレッドシート感覚で積み上げる</div>
<div class="points"><div><span class="check">✓</span>無料・登録なしですぐ使える</div><div><span class="check">✓</span>銀行や証券の口座連携は不要</div><div><span class="check">✓</span>スプレッドシートから移行できる</div></div>
</div>

</body></html>
